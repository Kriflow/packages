[[packages]]
name = "slack"
description = "Posts each gate to a Slack channel with a button per answer, and updates the message once the gate is answered, there or in Kriflow. A reply in a gate's thread asks the run's assistant, whose proposals come with Apply and Not now. Needs a Slack app of your own in Socket Mode (its README)."
git = "https://github.com/Kriflow/packages.git"
subfolder = "slack"
ref = "slack-v1.1.3"
contract = 1
permissions = [
  "network: slack.com",
  "network: *.slack.com",
  "install_network: pypi.org",
  "install_network: files.pythonhosted.org",
  "credentials: SLACK_BOT_TOKEN",
  "credentials: SLACK_APP_TOKEN",
  "capabilities: remote_approvals",
  "capabilities: run_assistant",
]

