# The curated index of Kriflow Connector Packages. Format and how to add one: README.md.

[[packages]]
name = "blender_build"
description = "Writes a Blender project from the script in a sandboxed coding session, checking shots with stills, then renders it on the GPU."
git = "https://github.com/Kriflow/packages.git"
subfolder = "blender_build"
ref = "blender_build-v1.1.3"
contract = 1
permissions = [
  "owned_folders: blender_templates",
  "capabilities: build_session",
  "capabilities: templates",
]

[[packages]]
name = "blender_render"
description = "Renders a Blender project's shots on the GPU, then its finish step, into one video."
git = "https://github.com/Kriflow/packages.git"
subfolder = "blender_render"
ref = "blender_render-v1.0.8"
contract = 1
permissions = [
  "install_network: pypi.org",
  "install_network: files.pythonhosted.org",
  "install_network: download.blender.org",
  "install_network: github.com",
  "install_network: release-assets.githubusercontent.com",
  "folders: worlds/{world}/assets",
  "gpu: the host's graphics card",
  "owned_folders: blender_templates",
  "capabilities: templates",
]

[[packages]]
name = "browser"
description = "A headless browser agents drive on sites with no API, signing in with a World Login they never see."
git = "https://github.com/Kriflow/packages.git"
subfolder = "browser"
ref = "browser-v1.0.0"
contract = 2
permissions = [
  "network: localhost",
  "install_network: pypi.org",
  "install_network: files.pythonhosted.org",
  "install_network: cdn.playwright.dev",
  "install_network: playwright.download.prss.microsoft.com",
  "install_network: storage.googleapis.com",
  "logins: the World Login a stage names, and its domains",
]

