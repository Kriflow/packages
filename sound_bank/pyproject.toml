# The Sound Bank connector's own uv project, outside the Kriflow workspace: its install step syncs
# these into the installed version's folder (ADR 0026).
[project]
name = "kriflow-sound-bank"
version = "0.1.0"
description = "Fetches CC0 sounds or keeps a made take into a world's Sound Bank"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["imageio-ffmpeg==0.6.0"]

[tool.uv]
package = false
